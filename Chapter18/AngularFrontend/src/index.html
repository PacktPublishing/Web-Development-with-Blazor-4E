<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AngularFrontend</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="runtime-config.js"></script>
  <script>
    (() => {
      const blazorBaseUrl =
        (window.__appConfig?.blazorBaseUrl ?? 'https://localhost:7154').replace(/\/$/, '');
      const customElementsScript = document.createElement('script');
      customElementsScript.src = `${blazorBaseUrl}/CustomElementsScript.js`;
      document.head.appendChild(customElementsScript);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
